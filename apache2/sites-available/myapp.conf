# ═══════════════════════════════════════════════════════════
# /etc/apache2/sites-available/myapp.conf
# Arsitektur: Nginx → Apache → FastAPI:8000 + React:3000
# ═══════════════════════════════════════════════════════════

<VirtualHost *:80>
    ServerName lcoalhost
    # ServerAlias www.yourdomain.com

    # ServerName yourdomain.com        # ← ganti dengan domain/IP server kamu
    # ServerAlias www.yourdomain.com

    # ── Logging ─────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/myapp_error.log
    CustomLog ${APACHE_LOG_DIR}/myapp_access.log combined

    # ── Header Keamanan ─────────────────────────────────────
    Header always set X-Frame-Options        "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection       "1; mode=block"
    Header always set Referrer-Policy        "strict-origin-when-cross-origin"

    # ── Gzip Compression ────────────────────────────────────
    AddOutputFilterByType DEFLATE text/plain text/css application/json \
        application/javascript text/xml application/xml image/svg+xml

    # ── Upload size (setara client_max_body_size 15M) ───────
    LimitRequestBody 15728640

    # ── Keepalive ke upstream ───────────────────────────────
    ProxyTimeout 120
    ProxyPreserveHost On

    # ════════════════════════════════════════════════════════
    # BLOK 1: API Backend → FastAPI :8000
    # ════════════════════════════════════════════════════════
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # ════════════════════════════════════════════════════════
    # BLOK 2: Static uploads (PDF, dll)
    # ════════════════════════════════════════════════════════
    ProxyPass        /uploads/ http://127.0.0.1:8000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:8000/uploads/

    # Cache di browser 7 hari
    <Location /uploads/>
        Header set Cache-Control "public, max-age=604800, immutable"
    </Location>

    # ════════════════════════════════════════════════════════
    # BLOK 3: FastAPI Swagger docs
    # ════════════════════════════════════════════════════════
    ProxyPass        /docs http://127.0.0.1:8000/docs
    ProxyPassReverse /docs http://127.0.0.1:8000/docs

    ProxyPass        /redoc http://127.0.0.1:8000/redoc
    ProxyPassReverse /redoc http://127.0.0.1:8000/redoc

    ProxyPass        /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

    # ════════════════════════════════════════════════════════
    # BLOK 4: React SPA + WebSocket (Vite HMR)
    # ════════════════════════════════════════════════════════
    RewriteEngine On

    # WebSocket upgrade untuk Vite HMR
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # ════════════════════════════════════════════════════════
    # BLOK 5: Health check Apache
    # ════════════════════════════════════════════════════════
    <Location /apache-health>
        ProxyPass "!"           # jangan proxy, tangani langsung
        Require all granted
        SetHandler server-info
    </Location>

</VirtualHost>