# ═══════════════════════════════════════════════════════════════════════════════
# frontend/nginx-spa.conf
# Konfigurasi Nginx di dalam container frontend untuk serve React SPA
# ═══════════════════════════════════════════════════════════════════════════════
 
server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # ── Kompresi gzip untuk asset React ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
 
    # ── Cache lama untuk asset yang di-hash Vite (bundle.js, style.xxx.css) ──
    # Vite secara otomatis menambahkan hash ke nama file: main.abc123.js
    # Sehingga aman di-cache permanen di browser
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
 
    # ── SPA fallback: semua route HTML dikembalikan ke index.html ────────────
    # Ini penting agar React Router bisa handle /dashboard, /login, dst.
    # tanpa mendapat 404 dari nginx
    location / {
        try_files $uri $uri/ /index.html;
    }
}
 