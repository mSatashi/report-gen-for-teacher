# ═══════════════════════════════════════════════════════════════════════════════
# default.conf — Virtual host utama aplikasi
#
# Arsitektur request:
#
#   Browser
#     │
#     ▼
#   Nginx :80  (container nginx, port host 80)
#     │
#     ├─── /api/v1/*  ──────────────► FastAPI backend:8000
#     ├─── /uploads/* ──────────────► FastAPI backend:8000  (static PDF)
#     ├─── /docs      ──────────────► FastAPI backend:8000  (Swagger)
#     ├─── /redoc     ──────────────► FastAPI backend:8000
#     └─── /*         ──────────────► React frontend:3000
#                                     (SPA — semua route dikembalikan index.html)
#
# ═══════════════════════════════════════════════════════════════════════════════
 
# ── Upstream: FastAPI Backend ──────────────────────────────────────────────────
# "backend" = nama service di docker-compose.yml
# Docker DNS internal menyelesaikan nama service ke IP container secara otomatis
upstream backend_api {
    server backend:8000;
 
    # Aktifkan keepalive ke backend agar koneksi TCP tidak selalu dibuka ulang
    keepalive 32;
}
 
# ── Upstream: React Frontend ───────────────────────────────────────────────────
# "frontend" = nama service di docker-compose.yml
upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}
 
# ── Server Block Utama ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;   # "_" = tangkap semua hostname (IP, localhost, domain apapun)
 
    # ── Header keamanan dasar ────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
 
    # ════════════════════════════════════════════════════════════════════════════
    # BLOK 1: API Backend — semua request ke /api/v1/*
    # ════════════════════════════════════════════════════════════════════════════
    location /api/ {
        # Teruskan ke FastAPI
        proxy_pass         http://backend_api;
 
        # Header wajib untuk reverse proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
 
        # Aktifkan keepalive ke upstream
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
 
        # Timeout — sesuaikan jika ada endpoint AI yang lambat
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;   # generate laporan AI bisa lama
        proxy_read_timeout    120s;
 
        # Nonaktifkan buffering untuk streaming response (SSE/chunked)
        proxy_buffering off;
    }
 
    # ════════════════════════════════════════════════════════════════════════════
    # BLOK 2: Static file upload (PDF hasil laporan)
    # Diakses via /uploads/pdf/laporan_xxx.pdf
    # ════════════════════════════════════════════════════════════════════════════
    location /uploads/ {
        proxy_pass         http://backend_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
 
        # Cache PDF di browser selama 7 hari
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
 
    # ════════════════════════════════════════════════════════════════════════════
    # BLOK 3: FastAPI Swagger docs (opsional, bisa dihapus di production)
    # ════════════════════════════════════════════════════════════════════════════
    location /docs {
        proxy_pass         http://backend_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
 
    location /redoc {
        proxy_pass         http://backend_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
 
    # FastAPI OpenAPI schema (dipakai Swagger UI secara internal)
    location /openapi.json {
        proxy_pass         http://backend_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
 
    # ════════════════════════════════════════════════════════════════════════════
    # BLOK 4: React SPA — semua route lain diarahkan ke frontend container
    # ════════════════════════════════════════════════════════════════════════════
    location / {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
 
        # Penting untuk WebSocket / HMR (Vite dev server)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
 
        proxy_read_timeout 60s;
    }
 
    # ════════════════════════════════════════════════════════════════════════════
    # BLOK 5: Health check endpoint Nginx sendiri
    # ════════════════════════════════════════════════════════════════════════════
    location /nginx-health {
        access_log off;       # jangan catat request health check di log
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}