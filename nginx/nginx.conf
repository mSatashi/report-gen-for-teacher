# ═══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Konfigurasi utama Nginx
# Peran: reverse proxy + static file server untuk proyek ini
# ═══════════════════════════════════════════════════════════════════════════════
 
# Jumlah worker process = jumlah CPU core (auto = deteksi otomatis)
worker_processes auto;
 
# Lokasi file PID nginx
pid /var/run/nginx.pid;
 
# ── Event ──────────────────────────────────────────────────────────────────────
events {
    # Maksimal koneksi simultan per worker
    worker_connections 1024;
}
 
# ── HTTP ───────────────────────────────────────────────────────────────────────
http {
    # Daftarkan semua MIME type (css, js, png, svg, dll)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
 
    # ── Logging ─────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
 
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
 
    # ── Performa ────────────────────────────────────────────────────────────────
    sendfile        on;   # kirim file langsung dari disk ke socket (efisien)
    tcp_nopush      on;   # kirim header + data dalam satu paket
    tcp_nodelay     on;   # nonaktifkan Nagle algorithm (cocok untuk API)
    keepalive_timeout 65; # koneksi keep-alive maksimal 65 detik
 
    # ── Kompresi gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;   # kompres hanya jika respons > 1KB
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
 
    # ── Ukuran body request ─────────────────────────────────────────────────────
    # Sesuaikan dengan MAX_UPLOAD_SIZE_MB di backend (default 10MB)
    client_max_body_size 15M;
 
    # ── Load konfigurasi virtual host ───────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
 