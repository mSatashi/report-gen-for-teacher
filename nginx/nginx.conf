upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# Uncomment blok server ini setelah SSL tersedia
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────────────────
server {
    listen 80;
    # Ganti dengan domain kamu saat production, atau biarkan _ untuk semua host
    server_name _;

    # Ukuran upload maksimal (sesuaikan dengan MAX_UPLOAD_SIZE_MB di backend)
    client_max_body_size 15M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API Backend ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout lebih panjang untuk endpoint AI yang lambat
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 30s;
    }

    # ── Upload files (serve langsung oleh Nginx, lebih efisien) ──────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Batasi tipe file yang bisa diakses
        location ~* \.(pdf|jpg|jpeg|png|gif|xlsx|csv)$ {
            try_files $uri =404;
        }
    }

    # ── API Docs (opsional — matikan di production) ───────────────────────────
    location /docs {
        proxy_pass http://backend/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header Host $host;
    }

    # ── React Frontend (semua route lain) ─────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Fallback SPA: semua route dikembalikan ke frontend
        proxy_intercept_errors on;
        error_page 404 = @frontend_fallback;
    }

    location @frontend_fallback {
        proxy_pass http://frontend;
    }
}

# ── HTTPS server block (uncomment setelah SSL tersedia) ───────────────────────
# server {
#     listen 443 ssl http2;
#     server_name yourdomain.com;
#
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
